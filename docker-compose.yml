# VaporDrop 部署編排
#
# 命名規則：所有 Docker 物件（專案、服務、容器、映像、網路、卷）一律以 vapordrop- 為前綴，
# 方便在共用主機上以 `docker ps --filter name=vapordrop` 一眼辨識與整批操作。
#
# 設計要點：
#   * vapordrop-redis 與密文儲存全部在 RAM（tmpfs），容器重啟即歸零。
#   * 只有 vapordrop-db 卷（SQLite，內含 Passkey 憑證）是持久資料。
#   * vapordrop-api 容器 read_only，非 root，禁止提權。
#   * vapordrop-caddy 關閉 access log。
#
# 啟動： cp .env.example .env && 編輯 .env && docker compose up -d --build

name: vapordrop

services:
  vapordrop-redis:
    image: redis:7-alpine
    container_name: vapordrop-redis
    hostname: vapordrop-redis
    restart: unless-stopped
    # 完全關閉持久化：無 RDB、無 AOF。內容不落磁碟。
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --databases 1
      --loglevel warning
    tmpfs:
      - /data:size=8m
    networks: [vapordrop-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  vapordrop-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: vapordrop-api:latest
    container_name: vapordrop-api
    hostname: vapordrop-api
    restart: unless-stopped
    depends_on:
      vapordrop-redis:
        condition: service_healthy
    env_file: .env
    environment:
      REDIS_URL: redis://vapordrop-redis:6379/0
      BLOB_DIR: /vapor
      DB_PATH: /data/vapor.db
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    tmpfs:
      # 密文只存在 RAM。noexec/nosuid/nodev 防止上傳內容被當成可執行檔。
      - /vapor:size=512m,mode=0700,uid=10001,gid=10001,noexec,nosuid,nodev
      - /tmp:size=32m,mode=1777
    volumes:
      # 唯一持久資料：Passkey 憑證與邀請碼
      - vapordrop-db:/data
    networks: [vapordrop-net]
    logging:
      # 不保留應用輸出，避免任何意外洩漏
      driver: "none"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz')\""]
      interval: 20s
      timeout: 5s
      retries: 3

  vapordrop-caddy:
    image: caddy:2-alpine
    container_name: vapordrop-caddy
    hostname: vapordrop-caddy
    restart: unless-stopped
    depends_on: [vapordrop-api]
    env_file: .env
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDR:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - vapordrop-caddy-data:/data
      - vapordrop-caddy-config:/config
    networks: [vapordrop-net]
    logging:
      driver: "none"

networks:
  vapordrop-net:
    name: vapordrop-net
    driver: bridge

volumes:
  vapordrop-db:
    name: vapordrop-db
  vapordrop-caddy-data:
    name: vapordrop-caddy-data
  vapordrop-caddy-config:
    name: vapordrop-caddy-config
